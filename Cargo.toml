[package]
name = "proj-panel"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Cross-platform GPUI Kit desktop tool aggregating projects loaded across AI agents"

[[bin]]
name = "ProjPanel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
futures = "0.3"
gpui-kit = "0.11.0"
percent-encoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSEvent", "NSImage", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSDictionary", "NSGeometry", "NSString", "NSValue"] }
raw-window-handle = "0.6"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[dev-dependencies]
tempfile = "3"

# Optimize third-party crates (GPUI, Taffy layout, SVG/text rendering) in dev builds
# while keeping incremental rebuilds of this crate fast.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
